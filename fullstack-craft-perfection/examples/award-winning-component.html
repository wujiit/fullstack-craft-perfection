<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awwwards-Tier Interactive Showcase (8-States & Design Tokens)</title>
  <style>
    /* ==========================================================================
       1. Embedded Design Tokens
       ========================================================================== */
    :root {
      --bg-base: #090d16;
      --bg-surface: #111726;
      --bg-elevated: #1a2236;
      --bg-glass: rgba(17, 23, 38, 0.7);

      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(6, 182, 212, 0.4);

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-cyan: #06b6d4;
      --accent-indigo: #6366f1;
      --accent-gradient: linear-gradient(135deg, #06b6d4 0%, #6366f1 100%);
      --accent-glow: rgba(6, 182, 212, 0.25);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-full: 9999px;

      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --duration-normal: 280ms;

      --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --shadow-hover: 0 20px 40px -15px var(--accent-glow);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 20% 15%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
    }

    /* Container */
    .showcase-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 28px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(12px);
      transition: transform var(--duration-normal) var(--ease-out-expo),
                  box-shadow var(--duration-normal) var(--ease-out-expo),
                  border-color var(--duration-normal) var(--ease-out-expo);
      position: relative;
      overflow: hidden;
    }

    /* 2. Hover State */
    .showcase-card:hover {
      transform: translateY(-3px) scale(1.005);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-highlight);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: rgba(6, 182, 212, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.25);
      margin-bottom: 16px;
      white-space: nowrap;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* Interactive Action Button (States: Default, Hover, Active, Focus, Disabled) */
    .btn-craft {
      position: relative;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: var(--accent-gradient);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      min-height: 44px;
      transition: transform 140ms var(--ease-out-expo),
                  box-shadow 240ms var(--ease-out-expo),
                  opacity 200ms ease;
    }

    .btn-craft:hover {
      box-shadow: 0 4px 16px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-craft:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-craft:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 3px;
    }

    .btn-craft:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 5. Skeleton State */
    .skeleton-box {
      position: relative;
      background: var(--bg-elevated);
      border-radius: 6px;
      overflow: hidden;
    }

    .skeleton-box::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      animation: shimmer 1.6s infinite var(--ease-out-expo);
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* State Switcher Controls */
    .state-switcher {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .btn-state {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 180ms ease;
    }

    .btn-state:hover {
      color: var(--text-primary);
      border-color: var(--border-highlight);
    }

    .btn-state.active {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <div class="showcase-card" id="cardContainer">
    <div class="badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      Awwwards Tier
    </div>
    
    <div id="contentView">
      <h2 class="card-title">Engineering Craft & Visual Perfection</h2>
      <p class="card-desc">Experience 8-state micro-interaction fidelity with hardware-accelerated GPU transitions, zero-reflow layout stability, and strict design token compliance.</p>
      
      <button class="btn-craft" id="mainButton">
        <span>Deploy Architecture</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <!-- Interactive State Switcher -->
  <div class="state-switcher">
    <button class="btn-state active" onclick="switchState('default')">Default</button>
    <button class="btn-state" onclick="switchState('loading')">Skeleton</button>
    <button class="btn-state" onclick="switchState('empty')">Empty</button>
    <button class="btn-state" onclick="switchState('error')">Error</button>
    <button class="btn-state" onclick="switchState('disabled')">Disabled</button>
  </div>

  <script>
    const contentView = document.getElementById('contentView');
    const mainButton = document.getElementById('mainButton');

    function switchState(state) {
      document.querySelectorAll('.btn-state').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      if (state === 'default') {
        contentView.innerHTML = `
          <h2 class="card-title">Engineering Craft & Visual Perfection</h2>
          <p class="card-desc">Experience 8-state micro-interaction fidelity with hardware-accelerated GPU transitions, zero-reflow layout stability, and strict design token compliance.</p>
          <button class="btn-craft" id="mainButton">
            <span>Deploy Architecture</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        `;
      } else if (state === 'loading') {
        contentView.innerHTML = `
          <div class="skeleton-box" style="height: 24px; width: 70%; margin-bottom: 12px;"></div>
          <div class="skeleton-box" style="height: 14px; width: 100%; margin-bottom: 8px;"></div>
          <div class="skeleton-box" style="height: 14px; width: 85%; margin-bottom: 24px;"></div>
          <div class="skeleton-box" style="height: 44px; width: 100%;"></div>
        `;
      } else if (state === 'empty') {
        contentView.innerHTML = `
          <div style="text-align: center; padding: 12px 0;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" style="margin-bottom: 12px;">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            </svg>
            <h3 style="font-size: 16px; margin-bottom: 6px;">No Projects Configured</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Initialize your first architecture package to begin.</p>
            <button class="btn-craft" style="width: auto; padding: 8px 20px;">Initialize Now</button>
          </div>
        `;
      } else if (state === 'error') {
        contentView.innerHTML = `
          <div style="text-align: center; padding: 12px 0;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-error, #ef4444)" stroke-width="1.5" style="margin-bottom: 12px;">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <h3 style="font-size: 16px; margin-bottom: 6px;">Connection Failed</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Unable to reach deployment gateway. Please retry.</p>
            <button class="btn-craft" style="width: auto; padding: 8px 20px;" onclick="switchState('default')">Retry Connection</button>
          </div>
        `;
      } else if (state === 'disabled') {
        contentView.innerHTML = `
          <h2 class="card-title">Engineering Craft & Visual Perfection</h2>
          <p class="card-desc">This action is temporarily restricted due to policy enforcement or permissions.</p>
          <button class="btn-craft" disabled>
            <span>Action Unavailable</span>
          </button>
        `;
      }
    }
  </script>
</body>
</html>
